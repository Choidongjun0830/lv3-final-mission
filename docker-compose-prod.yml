version: '3.8'

services:
  server-dev:
    image: choidongjun/lv3-final:latest
    container_name: server
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${PROD_SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${PROD_SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${PROD_SPRING_DATASOURCE_PASSWORD}
      LOGGING_FILE_NAME: /logs/prod.log
    restart: always
    volumes:
      - /home/ec2-user/prod/logs:/logs
