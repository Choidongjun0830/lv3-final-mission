name: Backend Prod Server Workflow

on:
  push:
    branches:
      - choidongjun0830-prod
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: application.yml 생성 (Prod 환경)
        run: |
          echo "Create application.yml(prod) from secret"
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_PROD_PROPERTIES }}" > src/main/resources/application.yml

      - name: JAR 빌드
        run: ./gradlew build --no-daemon -x test

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: DockerHub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 이미지 빌드 및 푸시
        run: |
          if ! docker buildx inspect ci-builder &>/dev/null; then
            docker buildx create --use --name ci-builder
          else
            docker buildx use ci-builder
          fi
          docker buildx build \
            --platform linux/arm64,linux/amd64 \
            --cache-from=type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/lv3-final:buildcache \
            --cache-to=type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/lv3-final:buildcache,mode=max \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/lv3-final:prod \
            --push .

  deploy:
    name: Production Server 배포
    needs: build
    runs-on: [ self-hosted, prod ]

#    environment:
#      name: production
#      url: https://moru.woowacourse.com

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: DockerHub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: .env file 생성
        run: |
          echo "PROD_SPRING_DATASOURCE_URL=${{ secrets.PROD_SPRING_DATASOURCE_URL }}" >> .env
          echo "PROD_SPRING_DATASOURCE_USERNAME=${{ secrets.PROD_SPRING_DATASOURCE_USERNAME }}" >> .env
          echo "PROD_SPRING_DATASOURCE_PASSWORD=${{ secrets.PROD_SPRING_DATASOURCE_PASSWORD }}" >> .env
          echo "LOGGING_FILE_NAME=/logs/lv3-final-prod.log" >> .env

      - name: 컨테이너 재실행
        run: |
          sudo docker compose \
            -f docker-compose-prod.yml \
            --env-file .env \
            up -d --remove-orphans --pull=always

      - name: Docker 리소스 정리
        run: |
          sudo docker container prune -f --filter "until=24h"
          sudo docker image prune     -f --filter "until=24h"
